<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>九九と筆算の道場 単元テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: 上にステップ選択、下に「図」と「式・入力」を左右に並べる作業パネル（狭い画面では縦積み）。
   箱の青い丸は手元の教材の図に合わせ、強調の「あと」の分だけオレンジにする。 */
:root{
  --bg:#edf1f6; --surface:#ffffff; --surface2:#f5f8fc; --ink:#14202e; --muted:#566678;
  --line:#d3dce7; --line-strong:#8fa0b4; --boxline:#24364b;
  --blue:#1d74d8; --blue-ink:#0f4c9a; --blue-soft:#dcebfb; --on-blue:#ffffff;
  --orange:#ee8416; --orange-soft:#fff0dc;
  --good:#12804d; --good-soft:#dff3e8; --warn:#9a5200; --warn-soft:#fdecd3;
  --font-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --font-num:"Zen Maru Gothic","BIZ UDPGothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif;
  --cs:clamp(30px,8.4vw,52px); --g:6px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1621; --surface:#172130; --surface2:#1e2b3d; --ink:#e8eef6; --muted:#9db0c4;
    --line:#2b394e; --line-strong:#5d7189; --boxline:#9db3cc;
    --blue:#4d9bf0; --blue-ink:#8cc0fa; --blue-soft:#1b3350; --on-blue:#06182c;
    --orange:#f5a04a; --orange-soft:#3a2a16;
    --good:#4cc58b; --good-soft:#15362a; --warn:#f0b463; --warn-soft:#3a2d17;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1621; --surface:#172130; --surface2:#1e2b3d; --ink:#e8eef6; --muted:#9db0c4;
  --line:#2b394e; --line-strong:#5d7189; --boxline:#9db3cc;
  --blue:#4d9bf0; --blue-ink:#8cc0fa; --blue-soft:#1b3350; --on-blue:#06182c;
  --orange:#f5a04a; --orange-soft:#3a2a16;
  --good:#4cc58b; --good-soft:#15362a; --warn:#f0b463; --warn-soft:#3a2d17;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.7}
button{font:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.eyebrow{margin:0;font-size:13px;letter-spacing:.12em;color:var(--muted)}
h1{margin:2px 0 4px;font-family:var(--font-num);font-size:clamp(26px,5.6vw,36px);line-height:1.25;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:42em}

/* ステップ選択 */
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* パネル */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:16px}
.phead{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:flex-start}
.phead>div:first-child{min-width:0;flex:1 1 320px}
.stepno{margin:0;font-size:13px;color:var(--muted);letter-spacing:.08em}
h2{margin:0;font-family:var(--font-num);font-size:clamp(22px,4.6vw,28px);line-height:1.3}
.desc{margin:4px 0 0;color:var(--muted);max-width:46em}
.seg{display:flex;border:1.5px solid var(--blue);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:10px 20px;cursor:pointer;color:var(--blue-ink);font-weight:700;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
.patrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.patrow .lab{font-size:14px;color:var(--muted);margin-right:4px}
.pat{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface2);border-radius:10px;padding:4px 12px;cursor:pointer;min-height:38px;font-size:14px}
.pat[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.mini{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--blue)}

/* 作業エリア */
.work{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.work{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:clamp(12px,2.6vw,20px)}
.cardhead{margin:0 0 10px;font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.figbody{display:flex;flex-direction:column;gap:12px;min-height:90px}
.figrow{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px}
.op{font-family:var(--font-num);font-size:clamp(24px,6vw,34px);font-weight:700;color:var(--muted)}
.frame{display:flex;flex-direction:column;gap:6px}
.box{display:flex;gap:var(--g);padding:var(--g);border:3px solid var(--boxline);border-radius:10px;background:var(--surface)}
.loose{display:grid;grid-template-columns:repeat(var(--n,5),var(--cs));gap:var(--g)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tile{display:grid;place-items:center;width:clamp(48px,11vw,64px);height:clamp(48px,11vw,64px);border-radius:12px;background:var(--blue);color:var(--on-blue);font-family:var(--font-num);font-weight:700;font-size:clamp(18px,4vw,24px);position:relative}
.tile.add{background:var(--orange);color:#1b1206}
.tile.gone{background:transparent;border:2px dashed var(--line-strong);color:var(--line-strong)}
.tile.gone::after{content:"✕";position:absolute;color:var(--warn);font-size:1.5em;opacity:.85}

/* 丸・くだもの */
.cell{width:var(--cs);height:var(--cs);display:grid;place-items:center;border-radius:50%;position:relative;font-size:calc(var(--cs)*.78);line-height:1;flex:none;user-select:none}
.cell:not(.fruit).on{background:var(--blue)}
.cell:not(.fruit).add{background:var(--orange)}
.cell.off{border:2px dashed var(--line-strong)}
.cell.ghost{border:2px dotted var(--line-strong);opacity:.7}
.cell:not(.fruit).gone{border:2px dashed var(--line-strong)}
.cell.fruit.add{box-shadow:0 0 0 3px var(--orange);}
.cell.fruit.gone{opacity:.35}
.cell.gone::after{content:"✕";position:absolute;font-size:.62em;font-weight:700;color:var(--warn);opacity:1}
.cell[data-tap]{cursor:pointer}
.cell[data-tap]:hover{box-shadow:0 0 0 3px var(--blue-soft)}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
.tapinfo{margin:0;font-size:14px;color:var(--blue-ink);background:var(--blue-soft);border-radius:8px;padding:6px 10px;align-self:flex-start}

/* 式 */
.lines{display:flex;flex-direction:column;gap:10px}
.main{font-family:var(--font-num);font-weight:700;font-size:clamp(26px,6vw,36px);line-height:1.3;padding-bottom:8px;border-bottom:1px dashed var(--line-strong)}
.line{display:flex;flex-direction:column;gap:0;padding:6px 10px;border-radius:10px;border-left:5px solid transparent}
.line.active{background:var(--blue-soft);border-left-color:var(--blue)}
.line.done{border-left-color:var(--good)}
.tag{font-size:13px;color:var(--muted)}
.eq{font-family:var(--font-num);font-weight:700;font-size:clamp(24px,5.6vw,32px);line-height:1.4}
.ans{color:var(--good)}
.sq,.blank{display:inline-block;min-width:1.5em;text-align:center;border-bottom:3px solid var(--blue);background:var(--surface);border-radius:6px;padding:0 .15em;color:var(--blue-ink)}
.sq{background:transparent;border-bottom:0;color:var(--muted)}
.blank.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.say{margin:12px 0 0;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.msg{min-height:1.7em;margin:10px 0 0;font-weight:700}
.msg.good{color:var(--good)}
.msg.warn{color:var(--warn)}
.hintbox{margin:8px 0 0;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--ink)}
.donebox{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--good-soft);font-family:var(--font-num);font-weight:700;font-size:clamp(17px,3.8vw,21px);line-height:1.6}

/* ボタン・テンキー */
.btn{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:10px 18px;cursor:pointer;min-height:48px;font-weight:700}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn:disabled{opacity:.4;cursor:default}
.navbtns,.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;max-width:340px}
.key{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:12px;min-height:54px;font-family:var(--font-num);font-size:24px;font-weight:700;cursor:pointer}
.key:active{background:var(--blue-soft)}
.key.enter{background:var(--blue);border-color:var(--blue);color:var(--on-blue);font-size:18px}
.progress{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pcount{font-weight:700}
.pdots{display:flex;gap:6px;flex-wrap:wrap}
.pd{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-strong)}
.pd.cur{border-color:var(--blue);background:var(--blue-soft)}
.pd.ok{background:var(--good);border-color:var(--good)}
.pd.miss{background:var(--orange);border-color:var(--orange)}

/* 結果 */
.result{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.result h3{margin:0;font-family:var(--font-num);font-size:clamp(22px,5vw,30px)}
.bigstars{font-size:34px;letter-spacing:4px;color:var(--orange)}
.misslist{margin:0;padding-left:1.2em;font-family:var(--font-num);font-weight:700}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 18px}
.notes summary{cursor:pointer;font-weight:700;min-height:32px}
.notes ul{margin:8px 0 0;padding-left:1.3em}
.notes li{margin:4px 0}
/* 達成度の棒グラフ・合格 */
.bar{position:relative;display:block;height:8px;border-radius:99px;background:var(--line)}
.bar i{display:block;height:100%;border-radius:99px;background:var(--blue);transition:width .5s ease}
.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.5;text-decoration:none}
.bar.ok i{background:var(--good)}
.pat{cursor:default}
.pat small{font-size:11px;color:var(--muted)}
.pat.on{border-color:var(--blue);background:var(--blue-soft)}
.pat:not(.on){opacity:.7}
.ubar{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-width:520px}
.ubar .bar{height:14px}
.ustat{margin:0;font-size:14px;color:var(--muted)}
.ustat .pass{color:var(--good);font-size:20px;margin-right:10px;font-family:var(--font-num)}
.passbanner{margin:0;padding:8px 18px;border-radius:12px;border:2px solid var(--good);background:var(--good-soft);color:var(--good);font-family:var(--font-num);font-weight:700;font-size:clamp(22px,5vw,30px)}
.needmore{margin:0;color:var(--muted)}
/* 単元一覧 */
.index{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(14px,3vw,22px);display:flex;flex-direction:column;gap:14px}
.ihead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
#overall{flex:1 1 320px;display:flex;align-items:center;gap:16px;min-width:0}
.ostat{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.ostat b{font-family:var(--font-num);font-size:36px;line-height:1}
.ostat span{font-size:13px;color:var(--muted);letter-spacing:.06em}
#overall .bar{flex:1 1 auto;height:6px;min-width:60px}
.btn.small{min-height:40px;padding:6px 16px;font-size:14px;font-weight:400}
#nav{display:flex;flex-direction:column}
.grow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 20px;padding:14px 0;border-top:1px solid var(--line)}
.gname{display:flex;flex-direction:column;gap:2px;padding-top:2px}
.gname b{font-size:15px}
.gcount{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.unit{display:flex;flex-direction:column;justify-content:space-between;gap:8px;text-align:left;min-height:88px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.unit:hover{border-color:var(--blue)}
.u-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.u-no{font-family:var(--font-num);font-weight:700;color:var(--muted);font-size:15px}
.u-stat{font-size:12px;color:var(--muted);white-space:nowrap}
.u-title{font-size:15px;line-height:1.35;font-weight:700;flex:1}
.unit .bar{height:5px}
.unit.passed .u-stat{color:var(--good);font-weight:700}
.unit[aria-current="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.unit[aria-current="true"] .u-no,.unit[aria-current="true"] .u-stat,.unit[aria-current="true"].passed .u-stat{color:var(--on-blue)}
.unit[aria-current="true"] .bar{background:rgba(255,255,255,.35)}
.unit[aria-current="true"] .bar i,.unit[aria-current="true"] .bar.ok i{background:var(--on-blue)}
.unit[aria-current="true"] .bar u{background:var(--on-blue);opacity:.9}
.ilegend{margin:0;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.lg-line{display:inline-block;width:2px;height:12px;background:var(--ink);opacity:.5}
@media (max-width:720px){
  .grow{grid-template-columns:minmax(0,1fr)}
  .gname{flex-direction:row;align-items:baseline;gap:10px}
  .ugrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* ひっ算 */
.hissan{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 18px 14px}
.hissan table{border-collapse:collapse;font-family:var(--font-num);font-weight:700;font-size:clamp(30px,8vw,44px);line-height:1.3;text-align:center}
.hissan td{min-width:1.6em;padding:0 .12em}
.hissan .hd td{font-size:13px;font-family:var(--font-body);font-weight:400;color:var(--muted);padding-bottom:4px}
.hissan .mk td{font-size:.5em;height:1.3em;color:var(--orange);line-height:1}
.hissan .sg{color:var(--muted);text-align:left}
.hissan .r td{border-top:3px solid var(--boxline)}
.hissan .r .ok{color:var(--good)}
.hissan .cx{text-decoration:line-through;text-decoration-color:var(--orange);text-decoration-thickness:3px;color:var(--muted)}
.hissan sup{font-size:.45em;color:var(--orange);vertical-align:top;position:relative;top:.15em}
.ph{display:inline-block;width:.8em;height:.8em;border:2px dashed var(--line-strong);border-radius:6px;vertical-align:middle}
/* 点数 */
.scoreline{margin:6px 0 0;font-size:14px;font-weight:700;color:var(--blue-ink)}
.scores{margin:0;display:flex;flex-wrap:wrap;gap:8px}
.scorebox{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 16px;min-width:110px}
.scorebox.now{border-color:var(--blue);background:var(--blue-soft)}
.scorebox small{display:block;font-size:13px;color:var(--muted)}
.scorebox b{font-family:var(--font-num);font-size:28px;line-height:1.2}
@media (prefers-reduced-motion:reduce){.pop,.blank.shake{animation:none}}

/* 九九アプリ */
.beltchip{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.btxt{display:flex;flex-direction:column;line-height:1.2}.btxt small{font-size:11px;color:var(--muted)}.btxt b{font-family:var(--font-num);font-size:18px}
.belt{display:inline-block;width:46px;height:14px;border-radius:3px;border:2px solid var(--boxline);position:relative;flex:none}
.belt::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:10px;transform:translateX(-50%);background:inherit;border:2px solid var(--boxline);border-radius:2px}
.belt.none{background:transparent;border-style:dashed;opacity:.6}.belt.none::after{display:none}
.belt.white{background:#fff}.belt.black{background:#1b1b1f;border-color:#6b7280}.belt.black::after{border-color:#6b7280}
.belt.big{width:150px;height:34px;border-width:3px}.belt.big::after{width:26px}
.cere{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0}
.ktable{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.kh{display:grid;place-items:center;font-size:13px;color:var(--muted);font-weight:700;min-height:26px}
.k{display:grid;place-items:center;min-height:clamp(28px,6.4vw,40px);border-radius:7px;border:1px solid var(--line);background:var(--surface);font-family:var(--font-num);font-weight:700;font-size:clamp(12px,3.2vw,17px);color:var(--ink)}
.k.heard{background:var(--surface2);color:var(--muted)}
.k.ok,.k.m{background:hsl(var(--h) 75% 84%);border-color:hsl(var(--h) 55% 55%);color:#1b1b1f}
.k.m:not(.ok){background:hsl(var(--h) 70% 88%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .k.ok,:root:not([data-theme="light"]) .k.m{background:hsl(var(--h) 45% 30%);color:#fff;border-color:hsl(var(--h) 50% 55%)}}
:root[data-theme="dark"] .k.ok,:root[data-theme="dark"] .k.m{background:hsl(var(--h) 45% 30%);color:#fff;border-color:hsl(var(--h) 50% 55%)}
.k.hl{box-shadow:0 0 0 2px var(--orange)}
.k.pulse{animation:pop .45s ease-out}
.klegend{margin:10px 0 0;font-size:13px;color:var(--muted)}
.tcard{align-self:start}
.vpop{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.vpop .popeq{font-family:var(--font-num);font-weight:700;font-size:clamp(36px,10vw,56px);color:hsl(var(--h) 60% 38%);animation:pop .35s ease-out}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .vpop .popeq{color:hsl(var(--h) 70% 72%)}}
:root[data-theme="dark"] .vpop .popeq{color:hsl(var(--h) 70% 72%)}
.popeq b{color:var(--good)}
.popread{font-size:clamp(18px,4.4vw,24px);font-family:var(--font-num);font-weight:700;color:var(--muted)}
.popcount{margin:8px 0 0;color:var(--muted);font-size:14px;min-height:1.7em}
.vnote{margin:10px 0 0;font-size:12px;color:var(--muted);line-height:1.9}.vnote select{font:inherit;max-width:100%;padding:4px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.mcq{font-family:var(--font-num);font-weight:700;font-size:clamp(34px,9vw,52px);text-align:center;margin:14px 0;line-height:1.3}
.qm{color:var(--blue-ink)}
.mcgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mcb{border:2px solid var(--line-strong);background:var(--surface);border-radius:14px;min-height:72px;font-family:var(--font-num);font-weight:700;font-size:clamp(26px,7vw,36px);cursor:pointer}
.mcb.long{font-size:clamp(18px,4.6vw,24px)}
.mcb:hover:not(:disabled){border-color:var(--blue);background:var(--blue-soft)}
.mcb.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.mcb.wrong{opacity:.4;border-style:dashed;text-decoration:line-through}
.mcbarwrap{flex:1;min-width:120px}.mcbarwrap .bar{height:10px}
.mccard{max-width:640px;margin:0 auto;width:100%}
.work.one{grid-template-columns:minmax(0,1fr)}
.rtitle{margin:0 0 8px;font-family:var(--font-num);font-size:clamp(22px,5vw,28px)}
.dangrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.dbtn.done{border-color:var(--good);color:var(--good)}

<script>
(function(){
'use strict';
/* ===== 4択テストの問題づくり（固定の問題：単元×回ごとに同じ問題が出ます） ===== */
let _s=1;
function seedStr(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}_s=(h>>>0)||1}
const rnd=n=>{_s=(_s+0x6D2B79F5)>>>0;let t=_s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return Math.floor(((t^(t>>>14))>>>0)/4294967296*n)};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r};
const pick=a=>a[rnd(a.length)];
const uniq=(arr,f)=>{const s=new Set();return arr.filter(x=>{const k=f(x);if(s.has(k))return false;s.add(k);return true})};
const OPS={'+':'＋','-':'−','*':'×','/':'÷'};
const POS=['一の位','十の位','百の位','千の位'];
const digs=n=>String(n).split('').reverse().map(Number);
const p10=k=>Math.pow(10,k);
const KATA=['ア','イ','ウ','エ'];

/* 図（ひっ算） */
function vfig(a,b,sign){
  const res=sign==='×'?a*b:(sign==='＋'?a+b:a-b);
  const nc=Math.max(String(a).length,String(b).length,String(res).length);
  const dg=v=>{const s=String(v),r=Array(nc).fill('');for(let i=0;i<s.length;i++)r[nc-s.length+i]=s[i];return r};
  const row=(sg,cells,cls)=>`<tr class="${cls||''}"><td class="sg">${sg}</td>${cells.map(c=>`<td>${c}</td>`).join('')}</tr>`;
  return `<div class="hissan"><table>${row('',dg(a))}${row(sign,dg(b))}${row('',Array(nc).fill('&nbsp;'),'r')}</table></div>`;
}
function dfig(N,d){
  const dg=String(N).split(''),nc=dg.length+1,empty='<td></td>'.repeat(nc);
  return `<div class="hissan"><table class="divt"><tr>${empty}</tr><tr><td class="dv">${d}</td>${dg.map(x=>`<td class="dd">${x}</td>`).join('')}</tr><tr>${empty}</tr></table></div>`;
}

/* ---------- くり上がり・くり下がり ---------- */
function carriesAdd(a,b){const da=digs(a),db=digs(b),n=Math.max(da.length,db.length);let c=0;const pos=[];for(let i=0;i<n;i++){const s=(da[i]||0)+(db[i]||0)+c;c=s>=10?1:0;if(c)pos.push(i)}return pos}
function borrowsSub(a,b){const da=digs(a),db=digs(b);let br=0;const pos=[];for(let i=0;i<da.length;i++){const t=da[i]-br-(db[i]||0);br=t<0?1:0;if(br)pos.push(i)}return pos}
function carriesMul1(a,m){const d=digs(a);let c=0,n=0;for(let i=0;i<d.length-1;i++){const t=d[i]*m+c;c=Math.floor(t/10);if(c>0)n++}return n}
function mulForget(a,m){const d=digs(a);let v=0;for(let i=0;i<d.length;i++){const t=d[i]*m;v+=(i<d.length-1?(t%10):t)*p10(i)}return v}
function dropZero(n){const s=String(n),i=s.indexOf('0',1);if(i<0)return null;return +(s.slice(0,i)+s.slice(i+1))}

/* ---------- まちがい方のモデル（数） ---------- */
function addW(a,b){
  const r=a+b,w=[],cp=carriesAdd(a,b);
  if(cp.length){
    const k=cp[0]+1;
    w.push([r-p10(k),'くり上がりの 1 を たすのを わすれた']);
    w.push([r+p10(k),'くり上がりの 1 を 2回 たしてしまった']);
    if(a>=10||b>=10){const da=digs(a),db=digs(b),n=Math.max(da.length,db.length);let s='';for(let i=n-1;i>=0;i--)s+=((da[i]||0)+(db[i]||0));w.push([+s,'くり上がらずに、位ごとの答えを そのまま ならべて書いた'])}
    else w.push([a,'はじめの数を そのまま 答えにした']);
  }else{
    if(a>=10||b>=10)w.push([r+10,'くり上がりが ないのに 1 を たしてしまった']);
    if(a<10&&b<10)w.push([Math.max(a,b),'大きい方の数だけを 答えにした']);
    if(a<10&&b<10)w.push([r+2,'数えまちがい（2 のずれ）']);
  }
  w.push([r+1,'数えまちがい・たし算の 1 のずれ'],[r-1,'数えまちがい・たし算の 1 のずれ']);
  if(a!==b)w.push([Math.abs(a-b),'たし算なのに ひき算を してしまった']);
  return w;
}
function subW(a,b){
  const r=a-b,w=[],bp=borrowsSub(a,b);
  if(a<20&&b<10&&a>10&&bp.length){
    const u=a-10;
    w.push([10*1+Math.abs(u-b),'ひけないので 小さい方から 大きい方を ひいてしまった']);
    w.push([r+10,'10 から ひくのを わすれて、10 を そのまま のこした']);
    w.push([u+b,'ひく数を たしてしまった']);
  }else if(bp.length){
    const k=bp[0]+1;
    w.push([r+p10(k),'くり下がりで 上の位を 1 へらすのを わすれた']);
    w.push([r-p10(k),'くり下げた 上の位を 2回 へらしてしまった']);
    const da=digs(a),db=digs(b);let s='';for(let i=da.length-1;i>=0;i--)s+=Math.abs(da[i]-(db[i]||0));
    w.push([+s,'ひけないとき、小さい方から 大きい方を ひいてしまった']);
  }else{
    if(a>=20){w.push([r-10,'くり下がりが ないのに 上の位を 1 へらしてしまった']);w.push([r+10,'ひき算の 位を まちがえた'])}
    else{w.push([b,'ひく数を そのまま 答えにした']);w.push([a,'はじめの数を そのまま 答えにした'])}
  }
  w.push([r+1,'数えまちがい・ひき算の 1 のずれ'],[r-1,'数えまちがい・ひき算の 1 のずれ'],[a+b,'ひき算なのに たし算を してしまった']);
  return w;
}
function mulW(a,b){
  const r=a*b,w=[];
  if(a<=9&&b<=9){
    w.push([a*(b+1),'かける数が 1つ ちがう（となりの九九）'],[a*(b-1),'かける数が 1つ ちがう（となりの九九）'],[(a+1)*b,'となりの段の九九を つかった'],[(a-1)*b,'となりの段の九九を つかった'],[a+b,'かけ算なのに たし算を してしまった']);
    if(r>=10){const s=String(r);w.push([+(s[1]+s[0]),'十の位と 一の位を ぎゃくに 書いた'])}
    return w.filter(x=>x[0]>=1);
  }
  if(b<10){
    const v=mulForget(a,b);
    if(v!==r)w.push([v,'くり上がりの数を たすのを わすれた']);
    const d=digs(a),idx=shuffle(range(0,d.length-1).filter(i=>d[i]>0));
    idx.slice(0,2).forEach(i=>{w.push([r+d[i]*p10(i),POS[i]+'の かけ算の 九九を 1つ まちがえた']);w.push([r-d[i]*p10(i),POS[i]+'の かけ算の 九九を 1つ まちがえた'])});
    const z=dropZero(r);if(z)w.push([z,'答えの 0 を 書きわすれた']);
    w.push([a+b,'かけ算なのに たし算を してしまった']);
    return w;
  }
  const b1=b%10,b2=Math.floor(b/10),p1=a*b1,p2=a*b2;
  w.push([p1+p2,'2だん目の答えを 1けた ずらして 書かなかった']);
  w.push([p1,'十の位の かけ算を わすれた']);
  w.push([r+10,'2つの答えを たすとき くり上がりを まちがえた'],[r-10,'2つの答えを たすとき くり上がりを まちがえた']);
  const v=mulForget(a,b1);if(v!==p1)w.push([r-(p1-v),'くり上がりの数を たすのを わすれた']);
  const z=dropZero(r);if(z)w.push([z,'答えの 0 を 書きわすれた']);
  w.push([p2*100+p1,'2だん目の答えの 一の位の 0 を 書きわすれて ならべた']);
  return w;
}
function divExactW(a,d){
  const q=a/d,w=[];
  w.push([q+1,'商を 1 大きく たててしまった'],[q-1,'商を 1 小さく たててしまった']);
  const z=dropZero(q);if(z)w.push([z,'商の 0 を 書きわすれた']);
  else w.push([q*10,'商の 位を まちがえた（0 を つけすぎた）']);
  if(q>=10)w.push([Math.floor(q/10),'商の 一の位を 書きわすれた']);
  w.push([a-d,'わり算なのに ひき算を してしまった']);
  w.push([d,'わる数を 答えにしてしまった']);
  return w;
}
/* あまりありのわり算：文字の選択肢 */
function divRemW(a,d){
  const q=Math.floor(a/d),r=a%d,w=[];
  const f=(x,y)=>`${x} あまり ${y}`;
  if(q>=1)w.push([f(q-1,r+d),'あまりが わる数より 大きい（もう1回 われる）']);
  w.push([f(r,q),'商と あまりを ぎゃくに 書いた']);
  w.push([String(q),'あまりを 書きわすれた']);
  w.push([f(q+1,r),'商を 1 大きく たててしまった']);
  w.push([f(q,d-r),'あまりを「わる数 − あまり」にしてしまった']);
  const z=dropZero(q);if(z)w.push([f(z,r),'商の 0 を 書きわすれた']);
  if(r+1<d)w.push([f(q,r+1),'ひき算で あまりを 1 まちがえた']);
  if(r-1>=1)w.push([f(q,r-1),'ひき算で あまりを 1 まちがえた']);
  if(q-1>=1)w.push([f(q-1,r),'商を 1 小さく たててしまった']);
  return w;
}

/* ---------- 解説（先生用） ---------- */
function solAdd(a,b){
  const da=digs(a),db=digs(b),n=Math.max(da.length,db.length);let c=0;const out=[];
  for(let i=0;i<n;i++){
    const x=da[i]||0,y=db[i]||0,s=x+y+c;
    let t=`${POS[i]}：${x}＋${y}${c?'＋'+c:''}＝${s}`;
    t+=(i===n-1)?` → ${s}を そのまま 書く`:(s>=10?` → ${s%10}を 書いて 1 くり上げる`:` → ${s}を 書く`);
    c=s>=10?1:0;out.push(t);
  }
  return out.join('。')+`。答え ${a+b}`;
}
function solSub(a,b){
  const da=digs(a),db=digs(b);let br=0;const out=[];
  for(let i=0;i<da.length;i++){
    const top=da[i]-br,y=db[i]||0;
    if(i>=db.length&&!br){out.push(`${POS[i]}：${da[i]}を そのまま 書く`);continue}
    if(top<y){out.push(`${POS[i]}：${top}から ${y} は ひけない → となりから 10 かりて ${top+10}−${y}＝${top+10-y}`);br=1}
    else{out.push(`${POS[i]}：${br?da[i]+'−1＝'+top+'、':''}${top}−${y}＝${top-y}`);br=0}
  }
  return out.join('。')+`。答え ${a-b}`;
}
function solMul1(a,m){
  const d=digs(a);let c=0;const out=[];
  for(let i=0;i<d.length;i++){
    const t=d[i]*m+c,up=Math.floor(t/10);
    out.push(`${POS[i]}：${d[i]}×${m}${c?'＋'+c:''}＝${t}`+((i<d.length-1&&up>0)?` → ${t%10}を 書いて ${up}を くり上げる`:(i<d.length-1?` → ${t}を 書く`:` → ${t}を 書く`)));
    c=up;
  }
  return out.join('。')+`。答え ${a*m}`;
}
function solMul(a,b){
  if(b<10)return solMul1(a,b);
  const b1=b%10,b2=Math.floor(b/10);
  return `${a}×${b1}＝${a*b1}（1だん目）。${a}×${b2}＝${a*b2}、十の位なので 1けた ずらして ${a*b2*10}（2だん目）。${a*b1}＋${a*b2*10}＝${a*b}。答え ${a*b}`;
}
function solDiv(a,d){
  const ds=String(a).split('').map(Number);let cur=0,started=false,qs='';const out=[];
  for(let i=0;i<ds.length;i++){
    cur=cur*10+ds[i];
    if(cur<d){
      if(started){qs+='0';out.push(`${cur}は ${d}より 小さいので 商に 0 を たてる`)}
      else out.push(`${cur}は ${d}より 小さいので 次の位まで いっしょに 見る`);
      continue;
    }
    const qd=Math.floor(cur/d);started=true;qs+=qd;
    out.push(`${cur}÷${d} → ${qd}を たてる（${d}×${qd}＝${d*qd}、${cur}−${d*qd}＝${cur-d*qd}）`);
    cur-=d*qd;
  }
  return out.join('。')+`。答え 商 ${+qs}`+(cur?` あまり ${cur}`:'');
}

/* ---------- 問題の組み立て ---------- */
const nfill=r=>[r+1,r-1,r+2,r-2,r+10,r-10,r+3,r-3,r+5].map(v=>[v,'けいさんミス（数が ずれた）']);
const okNum=(r,x)=>Number.isInteger(x[0])&&x[0]>=0&&x[0]!==r;
function mk(o){
  const right=String(o.right);

function solFact(it){

    if(a<=9&&b<=9&&a+b>10){const need=10-a,rest=b-need;return `${a}に あと ${need} で 10。${b}を ${need}と${rest}に 分けて、10＋${rest}＝${a+b}`}

}

function genSet(u,lv,used){

    if(got<n){

  const tg=shuffle(base);

const _cache={};
function unitSets(u){

const IT=(op,a,b,x)=>Object.assign({op,a,b},x||{});
const ease=it=>it.op==='+'?it.a+it.b:it.op==='-'?it.a:it.op==='*'?it.a*it.b:it.a;
/* 基本・標準・応用で、やさしい順に 使う範囲を変える */
function tiered(pool){
  const s=pool.slice().sort((x,y)=>ease(x)-ease(y)),n=s.length;
  if(n<8)return lv=>s;
  const k=Math.ceil(n*0.6);
  return lv=>lv===1?s.slice(0,k):lv===3?s.slice(n-k):s;
}

function petals(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var c=document.createElement('canvas');
  c.setAttribute('aria-hidden','true');c.id='petals';
  c.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50';
  var dpr=window.devicePixelRatio||1,W=window.innerWidth,H=window.innerHeight;
  c.width=W*dpr;c.height=H*dpr;document.body.appendChild(c);
  var x=c.getContext('2d');if(!x){c.remove();return}x.scale(dpr,dpr);
  var cols=['#ffb7c5','#ff9db4','#ffc8d6','#f7a1bd','#ffe1e9'],ps=[],i;
  for(i=0;i<90;i++)ps.push({x:Math.random()*W*0.9-W*0.1,y:-30-Math.random()*H*0.6,s:7+Math.random()*9,vy:1.6+Math.random()*2.4,vx:1+Math.random()*2.6,ph:Math.random()*6.28,sw:.04+Math.random()*.05,rot:Math.random()*6.28,vr:(Math.random()-.5)*.12,col:cols[i%cols.length]});
  var t0=null;
  function frame(ts){
    if(t0===null)t0=ts;
    x.clearRect(0,0,W,H);
    var alive=0;
    ps.forEach(function(p){
      p.x+=p.vx+Math.sin(p.ph)*1.2;p.y+=p.vy;p.ph+=p.sw*3;p.rot+=p.vr;
      if(p.y<H+30&&p.x<W+40)alive++;
      x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.scale(1,Math.cos(p.ph)*.8+.2);
      x.fillStyle=p.col;x.beginPath();
      x.moveTo(0,-p.s);x.bezierCurveTo(p.s,-p.s*.6,p.s*.8,p.s*.7,0,p.s);
      x.bezierCurveTo(-p.s*.8,p.s*.7,-p.s,-p.s*.6,0,-p.s);x.fill();
      x.restore();
    });
    if(alive>0&&ts-t0<4500)requestAnimationFrame(frame);
    else if(c.parentNode)c.parentNode.removeChild(c);
  }
  requestAnimationFrame(frame);
}

  d.id='pv';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-label','問題');
  d.dataset.uid=u.id;d.dataset.si=si===null?'all':si;d.dataset.t=teacherView?'1':'0';
  d.innerHTML=`<div class="pvbar"><b>${u.title}${si===null?'（3回ぜんぶ）':'（'+SETNAMES[si]+'）'}${teacherView?'　講師用':''}</b><span class="pvbtns"><button type="button" class="btn primary small" data-act="pv-print">印刷する</button><button type="button" class="btn small" data-act="pv-save">ファイルに保存</button><button type="button" class="btn small" data-act="pv-close">とじる</button></span></div><p class="pvnote">うまく印刷できないときは「ファイルに保存」を押して、保存したファイルをひらいて印刷してください。</p><div class="pvbody">${paperBody(u,idxs,teacherView)}</div>`;
  document.body.appendChild(d);document.body.classList.add('pvopen');
  d.scrollTop=0;
  const b=$('[data-act="pv-print"]',d);if(b)b.focus();
}
function closePaper(){const d=$('#pv');if(d)d.remove();document.body.classList.remove('pvopen')}
function savePaper(){
  const d=$('#pv');if(!d)return;
  const u=CFG.units.find(x=>x.id===d.dataset.uid),tv=d.dataset.t==='1',idxs=d.dataset.si==='all'?[0,1,2]:[+d.dataset.si];
  const html=paperDoc(u,idxs,tv);
  const name=`${CFG.prog}_${u.id}_${d.dataset.si==='all'?'all':'set'+(+d.dataset.si+1)}${tv?'_teacher':''}.html`;
  try{
    const blob=new Blob([html],{type:'text/html;charset=utf-8'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  }catch(e){alert('保存できませんでした。「印刷する」をお使いください。')}
}

/* ---------- 一覧・見出し ---------- */
function chipHtml(id,si){
  const b=bestOf(id,si),n=recOf(id,si).sc.length;
  const cls=b>=PASSQ?'ok':(n?'try':'');
  return `<i class="chip ${cls}" title="${SETNAMES[si]}">${SET_LABEL[si][0]}${b>=PASSQ?'✓':(n?lastOf(id,si):'')}</i>`;
}
function renderNav(){
  let h='',doneN=0,setsN=0;
  CFG.groups.forEach((gn,gi)=>{
    const inG=CFG.units.filter(u=>u.g===gi),pn=inG.filter(u=>unitDone(u.id)).length;
    doneN+=pn;
    h+=`<div class="grow"><div class="gname"><b>${gn}</b><span class="gcount">${pn} / ${inG.length} 単元クリア</span></div><div class="ugrid">`;
    inG.forEach(u=>{
      [0,1,2].forEach(si=>{if(setPassed(u.id,si))setsN++});
      const f=[0,1,2].some(si=>recOf(u.id,si).feel==='unsure');
      h+=`<button type="button" class="unit${unitDone(u.id)?' passed':''}" data-unit="${u.id}"${u.id===S.unit.id?' aria-current="true"':''}><span class="u-top"><span class="u-no">${u.no}</span><span class="u-stat">${unitDone(u.id)?'クリア ✓':(f?'要フォロー':'')}</span></span><span class="u-title">${u.short}</span><span class="chips">${[0,1,2].map(si=>chipHtml(u.id,si)).join('')}</span></button>`;
    });
    h+='</div></div>';
  });
  h+=`<p class="ilegend">基＝基本　標＝標準　応＝応用。8問以上で合格（✓）。数字は最新の正解数です。</p>`;
  $('#nav').innerHTML=h;
  const total=CFG.units.length*3;
  $('#overall').innerHTML=`<span class="ostat"><b>${setsN}</b><span>/ ${total}　合格した回</span></span><span class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(setsN*100/total)}"><i style="width:${Math.round(setsN*100/total)}%"></i></span>`;
}
function renderHead(){
  const u=S.unit;
  $('#stepNo').textContent=CFG.groups[u.g]+'　単元テスト';
  $('#stepTitle').textContent=u.title;
  $('#stepDesc').textContent=u.desc;
  $('#scoreLine').textContent='';
  $('#unitBar').innerHTML='';
}
function renderAll(){renderNav();renderHead();renderView()}
function renderView(){
  if(S.mode==='test')renderTest();
  else if(S.mode==='result')renderResult();
  else renderIntro();
}

/* ---------- 単元のトップ：3回のカード ---------- */
function renderIntro(){
  const u=S.unit,desc=u.paper?SET_DESC_H:SET_DESC;
  let h='<div class="setcards">';
  [0,1,2].forEach(si=>{
    const r=recOf(u.id,si),n=r.sc.length,b=bestOf(u.id,si),l=lastOf(u.id,si);
    const st=n?(b>=PASSQ?`<b class="pass">合格 ✓</b>　最新 ${l}／${NQ}　最高 ${b}／${NQ}`:`最新 ${l}／${NQ}　あと ${PASSQ-b}問で合格`):'まだ挑戦していません';
    h+=`<div class="card setcard"><p class="sname"><span class="snum">第${si+1}回</span><b>${SET_LABEL[si]}</b></p><p class="sdesc">${desc[si]}</p><p class="sstat">${st}${r.feel==='unsure'?'　<span class="flag">💬 少し不安</span>':''}</p><div class="actions"><button type="button" class="btn primary" data-act="start" data-si="${si}">テストをする</button><button type="button" class="btn" data-act="paper" data-si="${si}">問題を見る・印刷</button></div></div>`;
  });
  h+='</div>';
  if(teacher){
    h+=`<div class="card tcard"><p class="rtitle">講師用</p><p class="sdesc">問題・正解・解説・つまずきメモがのった紙面です（生徒には見せないでください）。</p><div class="actions">`+
      [0,1,2].map(si=>`<button type="button" class="btn" data-act="tpaper" data-si="${si}">第${si+1}回（${SET_LABEL[si]}）</button>`).join('')+
      `<button type="button" class="btn primary" data-act="tpaper" data-si="all">3回ぜんぶ</button></div></div>`;
  }
  h+=`<p class="hint">問題は、いつも同じ問題が出ます。まちがえたところは、あとで先生と一緒に見なおしましょう。</p>`;
  $('#view').innerHTML=h;
}
function startTest(si){
  const st=unitSets(S.unit)[si];
  T={si,set:st,ans:st.qs.map(()=>-1),msg:''};
  S.mode='test';S.si=si;renderAll();
  const p=$('.panel');if(p)p.scrollIntoView({block:'start'});
}

/* ---------- テスト ---------- */
function renderTest(){
  const st=T.set,long=q=>q.ch.some(c=>c.length>9);
  let h=`<div class="progress"><span class="pcount">${S.unit.title}　第${T.si+1}回（${SET_LABEL[T.si]}）</span><span class="pcount" id="ansCount"></span></div><div class="qlist">`;
  st.qs.forEach((q,i)=>{
    h+=`<fieldset class="card qcard" id="qc${i}"><legend><span class="qn">${i+1}</span></legend><div class="qstem">${q.q}</div>${q.fig?`<div class="tfig">${q.fig}</div>`:''}<div class="opts${long(q)?' long':''}" role="radiogroup" aria-label="${i+1}番の答え">`+
      q.ch.map((c,k)=>`<label class="opt${T.ans[i]===k?' sel':''}"><input type="radio" name="q${i}" value="${k}"${T.ans[i]===k?' checked':''}><span class="kt">${KATA_[k]}</span><span class="ct">${c}</span></label>`).join('')+'</div></fieldset>';
  });
  h+=`</div><div class="msg warn" id="msg" role="status">${T.msg||''}</div><div class="actions"><button type="button" class="btn primary" data-act="score">採点する</button><button type="button" class="btn" data-act="back">やめて一覧にもどる</button></div>`;
  $('#view').innerHTML=h;updCount();
}
function updCount(){
  const n=T.ans.filter(x=>x>=0).length,e=$('#ansCount');if(e)e.textContent=`答えた問題　${n} / ${NQ}`;
}
function pick_(i,k){
  T.ans[i]=k;T.msg='';
  const card=$('#qc'+i);
  if(card)card.querySelectorAll('.opt').forEach((l,j)=>l.classList.toggle('sel',j===k));
  const m=$('#msg');if(m)m.textContent='';
  updCount();
}
function scoreIt(force){
  const blanks=T.ans.map((a,i)=>a<0?i+1:0).filter(Boolean);
  if(blanks.length&&!force){
    T.msg=`まだ答えていない問題があります（${blanks.join('・')}番）。このまま採点するときは、もう一度「採点する」を押してください。`;
    T.warned=true;renderTest();
    const f=$('#qc'+(blanks[0]-1));if(f)f.scrollIntoView({block:'center'});
    return;
  }
  finish();
}
function finish(){
  const st=T.set;
  T.res=st.qs.map((q,i)=>T.ans[i]===q.a);
  T.ok=T.res.filter(Boolean).length;
  const r=rec(S.unit.id,T.si);r.sc.push(T.ok);r.feel='';save();
  S.mode='result';renderAll();
  const p=$('.panel');if(p)p.scrollIntoView({block:'start'});
  if(T.ok>=PASSQ)petals();
}

/* ---------- 結果（解説は出さない） ---------- */
function renderResult(){
  const u=S.unit,st=T.set,n=st.qs.length,ok=T.ok;
  let h=`<div class="work one"><div class="card result"><h3>${n}問中 ${ok}問 せいかい</h3>`;
  if(ok>=PASSQ)h+='<p class="passbanner">合格 やったね！</p>';
  else if(ok>=CLOSEQ)h+=`<p class="needmore closep">あと少しです（${PASSQ}問以上で合格）。まちがえた問題を見なおして、もう一度ためしてみよう。</p>`;
  else h+=`<p class="needmore">${PASSQ}問以上で合格です。あわてなくて大丈夫。まちがえたところを見なおして、もう一度やってみよう。</p>`;
  h+='<div class="rwrap"><table class="rtab"><thead><tr><th>番</th><th>分類</th><th>あなたの答え</th><th>せいかいの答え</th><th></th></tr></thead><tbody>';
  st.qs.forEach((q,i)=>{
    const a=T.ans[i],good=T.res[i];
    h+=`<tr class="${good?'':'ng'}"><td>${i+1}</td><td class="catc">${q.c}</td><td>${a<0?'—（答えなし）':KATA_[a]+'　'+q.ch[a]}</td><td>${KATA_[q.a]}　${q.ch[q.a]}</td><td class="${good?'okm':'ngm'}">${good?'○':'×'}</td></tr>`;
  });
  h+='</tbody></table></div>';
  /* 分類ごと */
  h+='<h4 class="subh">分類ごとの せいかい数</h4><div class="rwrap"><table class="rtab ctab"><tbody>';
  st.cats.forEach(c=>{
    const tot=st.qs.filter(q=>q.c===c).length,g=st.qs.filter((q,i)=>q.c===c&&T.res[i]).length;
    h+=`<tr><td class="catc">${c}</td><td class="catn">${g} / ${tot}</td><td class="catb"><span class="bar${g===tot?' ok':''}"><i style="width:${Math.round(g*100/tot)}%"></i></span></td></tr>`;
  });
  h+='</tbody></table></div>';
  /* 自己評価 */
  h+='<h4 class="subh">今の気もちは？</h4><div class="feelbox" id="feelbox"><div class="actions"><button type="button" class="btn feel" data-act="feel" data-v="ok">わかった</button><button type="button" class="btn feel" data-act="feel" data-v="unsure">少し不安、もう一度教えてほしい</button></div><p class="msg" id="feelmsg" role="status"></p></div>';
  h+='<div class="actions"><button type="button" class="btn primary" data-act="start" data-si="'+T.si+'">もう一度（同じ問題）</button>';
  if(T.si<2)h+=`<button type="button" class="btn" data-act="start" data-si="${T.si+1}">つぎの回へ（第${T.si+2}回 ${SET_LABEL[T.si+1]}）</button>`;
  h+=`<button type="button" class="btn" data-act="paper" data-si="${T.si}">問題を見る・印刷</button><button type="button" class="btn" data-act="list">この単元の一覧にもどる</button></div></div></div>`;
  $('#view').innerHTML=h;
}
function setFeel(v){
  const r=rec(S.unit.id,T.si);r.feel=v;save();
  const m=$('#feelmsg');
  m.className='msg '+(v==='ok'?'good':'warn');
  m.textContent=v==='ok'?'いいですね。つぎの回にも挑戦してみましょう。':'その気もちを大切にしましょう。先生に「少し不安」と伝えて、もう一度教えてもらいましょう。';
  document.querySelectorAll('.feel').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
  renderNav();
}

/* ---------- 操作 ---------- */
function setUnit(id,si){
  S.unit=CFG.units.find(u=>u.id===id)||CFG.units[0];S.mode='intro';T=null;
  renderAll();
  try{history.replaceState(null,'','#'+S.unit.id)}catch(e){}
  if(si!=null&&si>=0&&si<3)startTest(si);
}
function goPanel(){const p=$('.panel');if(p)p.scrollIntoView({block:'start',behavior:window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
let navOpen=true;
try{navOpen=localStorage.getItem(CFG.navKey)!=='0'}catch(e){}
function applyNav(){const nv=$('#nav'),b=$('#navToggle');nv.hidden=!navOpen;b.setAttribute('aria-expanded',navOpen);b.textContent=navOpen?'一覧をとじる':'単元一覧をひらく'}
function unlockTeacher(){
  const inp=$('#tword'),err=$('#terr');
  if(inp.value.trim()===TEACHER_WORD){
    teacher=true;try{sessionStorage.setItem('kogen-teacher','1')}catch(e){}
    inp.value='';err.textContent='';renderTeacherBox();renderView();
  }else{err.textContent='合言葉が ちがいます。';}
}
function renderTeacherBox(){
  const box=$('#tbox');
  if(teacher){
    box.innerHTML='<p>講師用が ひらいています。各単元のページに「講師用」（問題・解答・解説・つまずきメモ）が出ます。</p>'+teacherRecords()+'<div class="actions"><button type="button" class="btn" data-act="tlock">講師用をとじる</button></div>';
  }else{
    box.innerHTML='<label for="tword">合言葉</label> <input id="tword" type="password" autocomplete="off" class="tinput"> <button type="button" class="btn small" data-act="tunlock">ひらく</button> <span class="msg warn" id="terr" role="status"></span>';
  }
}
function teacherRecords(){
  let rows='';
  CFG.units.forEach(u=>{
    [0,1,2].forEach(si=>{
      const r=recOf(u.id,si);if(!r.sc.length)return;
      rows+=`<tr><td>${u.no} ${u.short}</td><td>第${si+1}回</td><td>${r.sc.join(', ')}</td><td>${r.feel==='unsure'?'少し不安':(r.feel==='ok'?'わかった':'')}</td></tr>`;
    });
  });
  if(!rows)return '<p class="sdesc">この端末の記録は、まだありません。</p>';
  return `<div class="rwrap"><table class="rtab"><thead><tr><th>単元</th><th>回</th><th>正解数の記録（／10）</th><th>自己評価</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

document.addEventListener('click',e=>{
  const t=e.target;let el;
  if((el=t.closest('[data-act]'))){
    const a=el.dataset.act;
    if(a==='pv-print'){window.print();return}
    if(a==='pv-save'){savePaper();return}
    if(a==='pv-close'){closePaper();return}
    if(a==='start'){startTest(+el.dataset.si);return}
    if(a==='paper'){openPaper(S.unit,+el.dataset.si,false);return}
    if(a==='tpaper'){if(teacher)openPaper(S.unit,el.dataset.si==='all'?null:+el.dataset.si,true);return}
    if(a==='score'){scoreIt(!!T.warned);return}
    if(a==='back'){S.mode='intro';T=null;renderAll();return}
    if(a==='list'){S.mode='intro';T=null;renderAll();goPanel();return}
    if(a==='feel'){setFeel(el.dataset.v);return}
    if(a==='tunlock'){unlockTeacher();return}
    if(a==='tlock'){teacher=false;try{sessionStorage.removeItem('kogen-teacher')}catch(err){}renderTeacherBox();renderView();return}
  }
  if((el=t.closest('[data-unit]'))){setUnit(el.dataset.unit);goPanel();return}
  if(t.closest('#navToggle')){navOpen=!navOpen;applyNav();try{localStorage.setItem(CFG.navKey,navOpen?'1':'0')}catch(err){}return}
  if(t.closest('#notesClose')){const nd=$('.notes');nd.open=false;nd.scrollIntoView({block:'nearest'});return}
  if(t.closest('#resetBtn')){
    const rb=$('#resetBtn');
    if(rb.dataset.armed){mem={units:{}};save();rb.dataset.armed='';rb.textContent='テストの記録を消す';setUnit(S.unit.id);renderTeacherBox()}
    else{rb.dataset.armed='1';rb.textContent='もう一度押すと、すべての記録が消えます';setTimeout(()=>{rb.dataset.armed='';rb.textContent='テストの記録を消す'},4000)}
    return;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches&&t.matches('.qcard input[type=radio]')&&S.mode==='test'){
    const i=+t.name.slice(1);pick_(i,+t.value);
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#pv'))closePaper();
  if(e.key==='Enter'&&e.target&&e.target.id==='tword'){e.preventDefault();unlockTeacher()}
});

/* ---------- 画面の骨組み ---------- */
document.title=CFG.title;
$('#h1').textContent=CFG.title;
$('#lead').textContent=CFG.lead;
$('#links').innerHTML=`<a href="${CFG.practiceUrl}">${CFG.practiceName}へ</a><a href="${CFG.otherUrl}">${CFG.otherName}へ</a><a href="${CFG.indexUrl}">算数プログラムの目次へ</a>`;
const NOTES=[
  '1つの単元に「第1回 基本」「第2回 標準」「第3回 応用」の3回があります。1回は4択（ア〜エ）10問で、8問以上で合格、6〜7問は「あと少し」です。',
  '問題は固定です（いつも同じ問題）。「問題を見る・印刷」で、紙のテストとして印刷できます。うまく印刷できないときは「ファイルに保存」を使ってください。',
  '採点では、正解・自分の答え・分類ごとの正解数を表示します。解説は生徒には表示しません。',
  '採点のあと「わかった」「少し不安、もう一度教えてほしい」を選ぶと、この端末に記録されます。「少し不安」は単元一覧に「要フォロー」と出ます。',
  '先生用：下の「講師用」に合言葉を入れると、問題・正解・解説・つまずきメモ（選んだ答えごとの原因）を表示・印刷できます。',
  '記録は、この端末のブラウザにだけ残ります。生徒が代わるときは「テストの記録を消す」を押してください。'
];
$('#notesList').innerHTML=NOTES.map(x=>`<li>${x}</li>`).join('');
(function(){const st=document.createElement('style');st.textContent=PCSS;document.head.appendChild(st)})();
applyNav();
renderTeacherBox();
(function(){
  let id=CFG.units[0].id,si=null;
  const h=(location.hash||'').replace('#','');
  if(h){const m=h.match(/^([a-z0-9]+)(?:-([123]))?$/);if(m&&CFG.units.find(u=>u.id===m[1])){id=m[1];if(m[2])si=+m[2]-1}}
  setUnit(id,si);
})();
window.__sansu={CFG,unitSets,paperDoc};

})();
</script>
</body>
</html>
